<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulsoAi — Desarrollo de Software & Ciberseguridad</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="description" content="Agencia de desarrollo de software, hiperautomatizacion de procesos y hacking etico. Desde Chile para el mundo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-BuZND3em.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CP3UDhrY.css">
  </head>
  <body>
    <div id="root"></div>
  <script>
    var _patched = false;
    function applyPatches() {
      if (_patched) return;

      // 1. Overlay animated video on top of logo img (don't remove the img, React still owns it)
      var logoImg = document.querySelector('img[src*="logo-pulsoai"][class*="object-contain"]');
      if (!logoImg) return; // not ready yet

      if (!document.getElementById('pulso-video-overlay')) {
        var wrap = logoImg.parentElement;
        var rect = logoImg.getBoundingClientRect();
        logoImg.style.opacity = '0'; // hide but keep in DOM for React
        var vid = document.createElement('video');
        vid.id = 'pulso-video-overlay';
        vid.src = '/pulsoai_logo.webm';
        vid.autoplay = true; vid.loop = true; vid.muted = true; vid.playsInline = true;
        vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:10;';
        if (getComputedStyle(wrap).position === 'static') wrap.style.position = 'relative';
        wrap.appendChild(vid);
      }

      // 2. Add WhatsApp after email — append outside React's text nodes
      if (!document.getElementById('wa-inject')) {
        var emailEl = document.querySelector('a[href="mailto:contacto@pulsoai.cl"]');
        if (!emailEl) return;
        var container = emailEl.closest('p,div,span[class]') || emailEl.parentElement;
        var waDiv = document.createElement('div');
        waDiv.id = 'wa-inject';
        waDiv.style.cssText = 'margin-top:8px;font-family:inherit;font-size:inherit;';
        waDiv.innerHTML = '<a href="https://wa.me/56974838536" target="_blank" rel="noopener noreferrer" style="color:#25D366;font-weight:bold;text-decoration:none;">💬 Chatea por WhatsApp</a>';
        container.insertAdjacentElement('afterend', waDiv);
      }

      _patched = true;
      if (window._patchObserver) { window._patchObserver.disconnect(); }
    }

    // Wait for React to settle, then apply — use idle callback to avoid conflicting with renders
    window._patchObserver = new MutationObserver(function() {
      if (!_patched && document.querySelector('img[src*="logo-pulsoai"]')) {
        requestAnimationFrame(function() { setTimeout(applyPatches, 200); });
      }
    });
    document.addEventListener('DOMContentLoaded', function() {
      window._patchObserver.observe(document.getElementById('root'), {childList:true, subtree:true});
      setTimeout(applyPatches, 1500); // fallback
    });
  </script>
  </body>
</html>
